name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: pingdotgg/t3code
          ref: ea6d3fc30fb066635f31326f49b85cdee8fbf8d7
          path: repos/t3code
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun add --global @oh-my-pi/pi-coding-agent@18.22.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      - name: Install packed artifact
        shell: bash
        run: npm install --global ./carlosgtrz-t3-import-*.tgz && t3-import --help
