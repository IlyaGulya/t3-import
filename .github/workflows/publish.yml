name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified package to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'IlyaGulya/t3-import' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false
      - name: Fetch pinned T3 source
        shell: bash
        run: |
          repository=$(node -p 'require("./native/t3-reference.json").repository')
          commit=$(node -p 'require("./native/t3-reference.json").commit')
          git init repos/t3code
          git -C repos/t3code fetch --depth=1 "$repository" "$commit"
          git -C repos/t3code checkout --detach FETCH_HEAD
      - name: Install the pinned T3 server for integration tests
        env:
          T3CODE_VERSION: 0.1.11-nightly.20261117.4838
          T3CODE_HOME: ${{ runner.temp }}/t3
          T3CODE_INSTALL_BIN_DIR: ${{ runner.temp }}/t3/bin
        shell: bash
        run: |
          sh repos/t3code/scripts/install.sh
          echo "T3_TEST_SERVER_BINARY=$T3CODE_HOME/runtime/versions/$T3CODE_VERSION/t3" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun add --global @oh-my-pi/pi-coding-agent@18.22.0
      - run: npm ci
      - run: npm run verify
      - run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --pack-destination "$RUNNER_TEMP/npm-release"
          npm install --global --prefix "$RUNNER_TEMP/npm-smoke" "$RUNNER_TEMP"/npm-release/*.tgz
          "$RUNNER_TEMP/npm-smoke/bin/t3-import" --version
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error

  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/download-artifact@v5
        with:
          name: npm-package
          path: npm-release
      - name: Publish with npm Trusted Publishing
        shell: bash
        run: |
          shopt -s nullglob
          archives=(./npm-release/ilyagulya-t3-import-*.tgz)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected one @ilyagulya/t3-import tarball." >&2
            exit 1
          fi
          npm publish "${archives[0]}" --registry=https://registry.npmjs.org --access public --tag latest --ignore-scripts
